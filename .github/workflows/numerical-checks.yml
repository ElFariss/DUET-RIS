name: Numerical checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      # Paper A needs GeoRIS-Bench next to it (physics, channel and solver modules of the shared
      # atomwise_ris namespace package). This passes only once GeoRIS-Bench on GitHub holds those modules.
      - uses: actions/checkout@v4
        with:
          path: paper-a-ris-physics
      - uses: actions/checkout@v4
        with:
          repository: ElFariss/GeoRIS-Bench
          path: GeoRIS-Bench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.8 "pillow>=11,<13" "h5py>=3.14,<4" "pyarrow>=20,<25"
      - working-directory: paper-a-ris-physics
        env:
          PYTHONPATH: src:scripts:../GeoRIS-Bench/src
        run: python -m unittest discover -s tests -v
